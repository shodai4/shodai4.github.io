<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません — shodai4.com</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314161a'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='34' fill='%23f4f1ea' text-anchor='middle'%3Es%3C/text%3E%3C/svg%3E">
<style>
  :root{--paper:#f4f1ea;--ink:#16181c;--ink-soft:#4a4d54;--line:#d9d2c6;--accent:#b8452c;
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
    background:radial-gradient(900px 500px at 20% 0%,#fbf8f2,rgba(251,248,242,0)) ,var(--paper);
    color:var(--ink);font-family:var(--sans);line-height:1.9;text-align:center}
  .box{max-width:30rem}
  .code{font-family:var(--serif);font-size:clamp(3rem,12vw,4.6rem);line-height:1;letter-spacing:.1em;margin:0 0 1.2rem}
  h1{font-family:var(--serif);font-weight:600;font-size:1.15rem;letter-spacing:.12em;margin:0 0 1rem}
  p{color:var(--ink-soft);font-size:.9rem;margin:0 0 2rem}
  a.home{display:inline-block;padding:.7rem 1.6rem;border:1px solid var(--ink);border-radius:999px;
    text-decoration:none;font-size:.82rem;letter-spacing:.12em;transition:background .2s,color .2s}
  a.home:hover{background:var(--ink);color:var(--paper)}
  .rule{width:40px;height:1px;background:var(--line);margin:1.6rem auto}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>ページが見つかりません</h1>
    <div class="rule"></div>
    <p>お探しのページは、移動したか、まだ存在しないようです。</p>
    <a class="home" href="/">shodai4.com へ戻る</a>
  </div>
</body>
</html>
